name: CI

# The app's backend and UI tests, and the README standard. They run offline: the
# only network use is installing the pinned test dependencies.
#
# The OS matrix is the manifest's `platform.os` claim, so every OS it names is
# tested here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Hooks run in the gateway's own interpreter, and Kiro Crew requires 3.12.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements.txt

      - name: Validate app.json is JSON
        run: python -c "import json; json.load(open('app.json', encoding='utf-8'))"

      - name: Run tests
        run: python -m pytest

  # The page is a committed ESM bundle (ui/dist/index.mjs): a Kiro Crew install is
  # a plain clone with no build step. This job proves the committed bundle is
  # exactly what the committed source builds.
  ui:
    name: UI (typecheck, test, reproducible bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: The committed bundle is the build output
        run: git diff --exit-code -- dist

  # The mechanical half of CHECKLIST.md: required README sections, no template
  # placeholders, alt text on every image, and every referenced media file
  # present and inside its size budget.
  readme:
    name: README standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check README.md against CHECKLIST.md
        run: python capture/check_readme.py README.md
